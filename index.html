<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>Retorno do Ponto · +1h12</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Retorno do ponto</h1>
    <p class="sub">Batida + 1h12</p>

    <form id="form" autocomplete="off">
      <label for="batida">Horário da batida (24h)</label>
      <div class="linha">
        <input
          id="batida"
          type="text"
          maxlength="5"
          inputmode="numeric"
          enterkeyhint="done"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          pattern="[0-9]{2}:[0-9]{2}"
          placeholder="HH:MM"
          autofocus
        >
        <button type="button" id="btn-agora" title="Preenche com o horário atual">Agora</button>
      </div>
    </form>

    <div id="resultado" class="resultado oculto" aria-live="polite">
      <span class="rotulo">Volte às</span>
      <span class="hora" id="hora-retorno">--:--</span>
      <span class="detalhe" id="detalhe"></span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
